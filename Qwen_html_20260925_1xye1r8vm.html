// ========== RENDER ==========
let score = 0;
let answered = 0;
const totalQ = questions.length;
document.getElementById('total').textContent = totalQ;

function renderQuiz() {
  const quiz = document.getElementById('quiz');
  quiz.innerHTML = '';
  let currentSection = '';
  let qIndex = 0;

  questions.forEach((q, i) => {
    if (q.section !== currentSection) {
      currentSection = q.section;
      const typeClass = q.type === 'easy' ? 'easy' : q.type === 'medium' ? 'medium' : q.type === 'hard' ? 'hard' : '';
      const div = document.createElement('div');
      div.className = 'section-title ' + typeClass;
      div.textContent = (q.type === 'theory' ? '📘 ' : q.type === 'easy' ? '🟢 ' : q.type === 'medium' ? '🟡 ' : '🔴 ') + currentSection;
      quiz.appendChild(div);
    }
    qIndex++;
    const qDiv = document.createElement('div');
    qDiv.className = 'question';
    qDiv.id = 'q' + i;
    qDiv.innerHTML = `
      <div class="q-text"><span class="q-num">${qIndex}</span>${q.text}</div>
      <div class="options" id="opts${i}">
        ${q.options.map((opt, j) => `
          <div class="option" data-q="${i}" data-opt="${j}" onclick="selectOption(${i}, ${j})">
            <span class="label">${String.fromCharCode(65+j)}</span>${opt}
          </div>
        `).join('')}
      </div>
      <div class="explanation" id="exp${i}"></div>
    `;
    quiz.appendChild(qDiv);
  });
}

function selectOption(qIdx, optIdx) {
  const q = questions[qIdx];
  const optsDiv = document.getElementById('opts' + qIdx);
  const options = optsDiv.querySelectorAll('.option');

  // Nếu đã trả lời rồi thì không làm gì
  if (optsDiv.dataset.answered === 'true') return;
  optsDiv.dataset.answered = 'true';

  const isCorrect = optIdx === q.correct;
  if (isCorrect) score++;
  answered++;
  document.getElementById('score').textContent = score;

  // Highlight đúng/sai
  options.forEach((opt, j) => {
    opt.classList.add('disabled');
    if (j === q.correct) opt.classList.add('correct');
    if (j === optIdx && !isCorrect) opt.classList.add('wrong');
  });

  // Hiển thị giải thích
  const expDiv = document.getElementById('exp' + qIdx);
  let html = '<strong>💡 Giải thích chi tiết:</strong><br>';
  q.options.forEach((_, j) => {
    html += `<div style="margin: 6px 0;">• <strong>${String.fromCharCode(65+j)}:</strong> ${q.explain[j]}</div>`;
  });
  expDiv.innerHTML = html;
  expDiv.classList.add('show');

  // Scroll đến giải thích
  setTimeout(() => expDiv.scrollIntoView({behavior: 'smooth', block: 'nearest'}), 200);
}

function resetQuiz() {
  if (!confirm('Bạn có chắc muốn làm lại từ đầu?')) return;
  score = 0;
  answered = 0;
  document.getElementById('score').textContent = 0;
  renderQuiz();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

renderQuiz();
</script>
